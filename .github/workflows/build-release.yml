name: Build & Release WorkBuddy Linux

on:
  workflow_dispatch:
    inputs:
      dmg_url:
        description: 'DMG URL (empty = auto-fetch latest)'
        required: false
        type: string
        default: ''

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      # ── 1. Checkout ──────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── 2. Resolve version & download DMG ────────────────────
      - name: Resolve version and download DMG
        id: dmg
        run: |
          set -euo pipefail
          mkdir -p downloads

          USER_URL="${{ inputs.dmg_url }}"
          if [ -n "$USER_URL" ] && [ "$USER_URL" != "null" ]; then
            DMG_URL="$USER_URL"
          else
            echo "::group::Fetching latest version from API"
            API_JSON=$(curl -sL "https://www.codebuddy.cn/v2/update?platform=workbuddy-darwin-x64")
            echo "API response: $API_JSON"
            ZIP_URL=$(echo "$API_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin)['url'])")
            DMG_URL="${ZIP_URL%.zip}.dmg"
            echo "::endgroup::"
          fi

          DMG_FILE="downloads/WorkBuddy.dmg"
          echo "Downloading: $DMG_URL"
          curl -fSL --retry 3 --retry-delay 10 -o "$DMG_FILE" "$DMG_URL"
          ls -lh "$DMG_FILE"

          # Extract version from filename
          BASENAME="${DMG_URL##*/}"
          VERSION=$(echo "$BASENAME" | grep -oP '\d+\.\d+\.\d+' | head -1 || echo "0.0.0")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dmg_file=$DMG_FILE" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      # ── 3. Install system dependencies ───────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            p7zip-full curl nodejs npm python3 \
            dpkg-dev rpm squashfs-tools zstd \
            libx11-dev libxkbfile-dev libsecret-1-dev libglib2.0-dev \
            pkg-config make g++

          echo "node: $(node --version)"
          echo "npm: $(npm --version)"

      # ── 4. Build WorkBuddy Linux app ────────────────────────
      - name: Build WorkBuddy Linux app
        env:
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
        run: |
          set -Eeuo pipefail
          echo "=== Building from ${{ steps.dmg.outputs.dmg_file }} ==="
          bash install.sh "${{ steps.dmg.outputs.dmg_file }}"
          echo "=== Build complete ==="

      # ── 5. Build DEB ────────────────────────────────────────
      - name: Package DEB
        run: |
          bash scripts/build-deb.sh
          ls -lh dist/*.deb

      # ── 6. Build AppImage (mksquashfs, no FUSE) ─────────────
      - name: Package AppImage
        run: |
          set -euo pipefail
          VERSION="${{ steps.dmg.outputs.version }}"
          APPDIR="dist/AppDir"
          APP_ID="workbuddy"

          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/opt/$APP_ID" \
                   "$APPDIR/usr/bin" \
                   "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          cp -a workbuddy-app/. "$APPDIR/opt/$APP_ID/"

          # AppRun
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/bash
          set -euo pipefail
          APPDIR="$(dirname "$(readlink -f "$0")")"
          export CHROME_DESKTOP="workbuddy.desktop"
          export ELECTRON_FORCE_IS_PACKAGED=1
          export XDG_CURRENT_DESKTOP="Unity:${XDG_CURRENT_DESKTOP:-}"
          unset ELECTRON_RUN_AS_NODE 2>/dev/null || true
          exec "$APPDIR/opt/workbuddy/electron" \
            --disable-dev-shm-usage --in-process-gpu \
            --ozone-platform-hint=auto --enable-wayland-ime \
            --no-sandbox --disable-gpu-sandbox "$@"
          EOF
          chmod 0755 "$APPDIR/AppRun"

          # Desktop entry
          cat > "$APPDIR/$APP_ID.desktop" <<EOF
          [Desktop Entry]
          Name=WorkBuddy
          Comment=AI Agent Desktop Application
          Exec=opt/workbuddy/start.sh %F
          Icon=workbuddy
          Type=Application
          Categories=Development;IDE;
          StartupNotify=true
          EOF
          cp "$APPDIR/$APP_ID.desktop" "$APPDIR/usr/share/applications/"

          # Icon
          if [ -f workbuddy-app/.workbuddy-linux/workbuddy.png ]; then
            cp workbuddy-app/.workbuddy-linux/workbuddy.png "$APPDIR/workbuddy.png"
            cp workbuddy-app/.workbuddy-linux/workbuddy.png "$APPDIR/.DirIcon"
            cp workbuddy-app/.workbuddy-linux/workbuddy.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/"
          fi

          # Download runtime + build squashfs AppImage
          curl -fsSL -o dist/runtime-x86_64 \
            "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64"
          chmod +x dist/runtime-x86_64

          OUTPUT="dist/WorkBuddy-${VERSION}-x86_64.AppImage"
          mksquashfs "$APPDIR" "${OUTPUT}.squashfs" -noappend -comp gzip -root-owned -no-xattrs
          cat dist/runtime-x86_64 "${OUTPUT}.squashfs" > "$OUTPUT"
          chmod +x "$OUTPUT"
          rm -f "${OUTPUT}.squashfs"
          ls -lh "$OUTPUT"

      # ── 7. Build RPM (best-effort) ──────────────────────────
      - name: Package RPM
        continue-on-error: true
        run: |
          if command -v rpmbuild >/dev/null 2>&1; then
            bash scripts/build-rpm.sh || echo "RPM build failed"
          else
            echo "rpmbuild not available, skipping"
          fi

      # ── 8. Upload artifacts ─────────────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WorkBuddy-Linux-${{ steps.dmg.outputs.version }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          retention-days: 7

      # ── 9. Create Release ───────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.dmg.outputs.version }}
          name: WorkBuddy v${{ steps.dmg.outputs.version }} Linux
          body: |
            ## WorkBuddy v${{ steps.dmg.outputs.version }} — Linux 移植版

            自动从官方 macOS DMG 构建，适用于 x86_64 Linux。

            | 文件 | 格式 | 适用系统 |
            |---|---|---|
            | `*_amd64.deb` | Debian | Ubuntu / Debian / Mint |
            | `*.x86_64.rpm` | RPM | Fedora / RHEL / openSUSE |
            | `*-x86_64.AppImage` | AppImage | 通用 Linux（免安装） |

            ```bash
            # Debian/Ubuntu
            sudo dpkg -i workbuddy_*_amd64.deb
            # AppImage
            chmod +x WorkBuddy-*.AppImage && ./WorkBuddy-*.AppImage
            ```

            > 非官方移植，请勿向官方反馈 Linux Bug。
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          draft: true
          generate_release_notes: true
